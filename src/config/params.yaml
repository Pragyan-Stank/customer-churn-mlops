# src/config/params.yaml

model:
  # XGBoost hyperparameter search ranges (Optuna)
  n_estimators_min: 100
  n_estimators_max: 1000
  max_depth_min: 3
  max_depth_max: 10
  learning_rate_min: 0.01
  learning_rate_max: 0.3
  subsample_min: 0.6
  subsample_max: 1.0
  colsample_bytree_min: 0.6
  colsample_bytree_max: 1.0
  min_child_weight_min: 1
  min_child_weight_max: 10

training:
  n_trials: 20
  random_seed: 42

preprocess:
  test_size: 0.2
  random_seed: 42

evaluation:
  threshold_auc: 0.80

mlflow:
  tracking_uri: "http://127.0.0.1:5000"
  experiment_name: "customer-churn-deployment"

registry:
  model_name: "customer-churn-model"
  alias: "champion"

data:
  raw_path: "data/raw/Churn_Modelling.csv"
  ingested_path: "data/interim/ingested.csv"
  train_path: "data/processed/train.pkl"
  test_path: "data/processed/test.pkl"