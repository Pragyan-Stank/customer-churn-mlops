
upstream fastapi {
    server 13.220.173.47:8000;
    keepalive 32;              # Reuse connections to backend
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Timeouts ──────────────────────────────────────────
    proxy_connect_timeout       10s;
    proxy_send_timeout          60s;
    proxy_read_timeout          60s;

    # ── Static Frontend ───────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API Reverse Proxy ─────────────────────────────────
    # All requests to /api/* are forwarded to FastAPI.
    # The trailing slash on proxy_pass strips the /api prefix:
    #   /api/predict  →  backend:8000/predict
    #   /api/         →  backend:8000/
    location /api/ {
        proxy_pass         http://fastapi/;
        proxy_http_version 1.1;

        # Required for keepalive upstream connections
        proxy_set_header   Connection        "";

        # Pass real client info to FastAPI
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Static Asset Caching ──────────────────────────────
    location ~* \.(css|js|ico|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── Security Headers ──────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"                       always;
    add_header X-Frame-Options         "DENY"                          always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
}
